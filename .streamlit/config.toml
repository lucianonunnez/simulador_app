# ============================================================================
# Configuración visual y de servidor de Streamlit
# ============================================================================

[theme]
# Paleta Swiss Medical
primaryColor = "#E4002B"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#212529"
font = "sans serif"

[server]
# Max upload size (MB). 50 alcanza de sobra para los exports de MicroStrategy
# (un consumo mensual ronda los 3 MB); un techo bajo acota el riesgo de DoS
# por archivos gigantes (openpyxl descomprime todo en RAM).
maxUploadSize = 50

# Protección contra CSRF y peticiones cross-origin. Deben quedar activas en
# cualquier despliegue; ver docs/DESPLIEGUE.md si un proxy rompe los tokens XSRF.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Oculta el menú de desarrollo de Streamlit (botón "Deploy", rerun, etc.).
toolbarMode = "minimal"
