# Credenciales de acceso. Crear el Secret real sin versionarlo, por ejemplo:
#
#   kubectl create secret generic simulador-credentials \
#     --from-literal=SIMULADOR_USER=admin \
#     --from-literal=SIMULADOR_PASSWORD='...' \
#     --from-literal=SIMULADOR_COOKIE_KEY="$(openssl rand -hex 32)"
#
# Alternativa: montar un secrets.toml completo (varios usuarios) con
#   kubectl create secret generic simulador-secrets-toml --from-file=secrets.toml
# y descomentar el volumen correspondiente en deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: simulador-credentials
  labels:
    app.kubernetes.io/name: simulador-cm
type: Opaque
stringData:
  SIMULADOR_USER: admin
  SIMULADOR_PASSWORD: change-me
  SIMULADOR_COOKIE_KEY: ""
